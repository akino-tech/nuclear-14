  name: кость
  description: Белая и прочная.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/mob_drops.rsi
    layers:
    - state: bone
      map: ["base"]
  - type: Stack
    stackType: ForgeAnimalBone
    count: 1
    baseLayer: base
    layerStates:
